
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>FitZone - Login</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }

        .login-container {
            background: white;
            padding: 35px;
            width: 320px;
            border-radius: 12px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #2563eb;
        }

        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #2563eb;
            color: white;
            border: none;
            cursor: pointer;
        }

        .error {
            color: red;
            text-align: center;
        }
    </style>
</head>

<body>

    <div class="login-container">

        <h1>FitZone Gym</h1>

        <h3>Member Login</h3>

        <form method="POST" action="/">

            <input
                type="text"
                id="username"
                name="username"
                placeholder="Enter username"
                required
            >

            <input
                type="password"
                id="password"
                name="password"
                placeholder="Enter password"
                required
            >

            <button
                type="submit"
                id="login-btn"
            >
                Login
            </button>

        </form>

        {% if error %}
            <p id="error-message" class="error">
                {{ error }}
            </p>
        {% endif %}

    </div>

</body>
</html>
